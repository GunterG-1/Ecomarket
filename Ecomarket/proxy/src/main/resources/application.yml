server:
  port: 9000

spring:
  application:
    name: proxy

  cloud:
    gateway:
      routes:
        - id: usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**, /api/admin/usuarios/**, /api/servicio/**

        - id: productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/productos/**

        - id: ventas
          uri: http://localhost:8083
          predicates:
            - Path=/api/ventas/**

        - id: logistica
          uri: http://localhost:8084
          predicates:
            - Path=/api/envios/**

